apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-argo-application
  namespace: argocd
spec:
  type: ClusterIP
  project: default
  source:
    repoURL: https://github.com/Marve-obas/argocd-app.git  
    targetRevision: feature/branch-s12kunball-argocd-deploment
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: s12kunballi
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      enabled: true
      selfHeal: true
      prune: true
